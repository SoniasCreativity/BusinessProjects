<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Image Layout Composer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Product Image Layout Composer</h1>
            <p>Create professional product layouts for marketing and social media</p>
        </header>

        <div class="main-content">
            <!-- Control Panel -->
            <div class="control-panel">
                <h2>Layout Selection</h2>
                
                <div class="layout-buttons">
                    <button class="layout-btn" data-layout="vinyl-lp">
                        <span class="btn-number">1</span>
                        <span class="btn-text">Vinyl LP</span>
                    </button>
                    <button class="layout-btn" data-layout="vinyl-ep">
                        <span class="btn-number">2</span>
                        <span class="btn-text">Vinyl EP</span>
                    </button>
                    <button class="layout-btn" data-layout="cd">
                        <span class="btn-number">3</span>
                        <span class="btn-text">CD</span>
                    </button>
                    <button class="layout-btn" data-layout="cassette">
                        <span class="btn-number">4</span>
                        <span class="btn-text">Cassette</span>
                    </button>
                    <button class="layout-btn" data-layout="books">
                        <span class="btn-number">5</span>
                        <span class="btn-text">Books</span>
                    </button>
                </div>

                <h2 style="margin-top: 30px;">Image Upload</h2>
                
                <div class="form-group">
                    <label for="image-input">Upload Images (JPG/PNG):</label>
                    <input type="file" id="image-input" accept="image/*" multiple>
                    <small>Upload 2-3 images. Use filenames with "front", "back", or generic names.</small>
                </div>

                <div id="uploaded-images" class="uploaded-images"></div>

                <h2 style="margin-top: 30px;">Image Adjustments</h2>
                
                <div class="form-group">
                    <label for="rotation">Image Rotation:</label>
                    <div class="slider-container">
                        <input type="range" id="rotation" min="-45" max="45" value="0" class="slider">
                        <span id="rotation-value">0°</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="spacing">Image Spacing:</label>
                    <div class="slider-container">
                        <input type="range" id="spacing" min="0" max="100" value="0" class="slider">
                        <span id="spacing-value">0%</span>
                    </div>
                </div>

                <div class="button-group">
                    <button id="preview-btn" class="btn btn-dark-green">Preview</button>
                    <button id="download-btn" class="btn btn-silver">Download JPG</button>
                    <button id="reset-btn" class="btn btn-gray">Reset</button>
                </div>
            </div>

            <!-- Preview Area -->
            <div class="preview-area">
                <h2>Preview</h2>
                <div id="canvas-container" class="canvas-container">
                    <canvas id="preview-canvas"></canvas>
                </div>
                <div id="status-message" class="status-message"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
